<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="app"><header class="topbar"><div class="brand"><span class="brand-mark">J</span><div><strong>JARVIS</strong><small>asistente personal</small></div></div><div class="top-actions"><span id="status" class="status">● conectando</span><button id="login-open" class="login-btn">Iniciar sesión</button><button id="logout" class="login-btn hidden">Cerrar sesión</button></div></header><main class="chat-layout"><section id="messages" class="messages"><div class="welcome"><div class="welcome-icon">J</div><h1>¿En qué puedo ayudarte?</h1><p>Un solo chat con contexto, memoria y razonamiento local.</p><div class="suggestions"><button data-prompt="Explícame qué es la física cuántica de forma sencilla">Física cuántica</button><button data-prompt="Ayúdame a crear una API en JavaScript">Programación</button><button data-prompt="¿Qué puedes hacer?">Capacidades</button></div></div></section><form id="chat-form" class="composer"><textarea id="message" rows="1" placeholder="Mensaje para JARVIS…" required></textarea><button class="send" type="submit" aria-label="Enviar">↑</button><div class="composer-note">JARVIS puede cometer errores. Verifica la información importante.</div></form></main></div><div id="auth-modal" class="modal hidden"><div class="modal-card"><button id="auth-close" class="modal-close">×</button><h2 id="auth-title">Iniciar sesión</h2><p id="auth-subtitle">Guardá tu memoria y conversaciones en Firebase.</p><input id="auth-email" type="email" placeholder="Correo electrónico" autocomplete="email"><input id="auth-password" type="password" placeholder="Contraseña" autocomplete="current-password"><button id="auth-submit" class="auth-submit">Iniciar sesión</button><button id="auth-toggle" class="auth-toggle">Crear una cuenta</button><p id="auth-error" class="auth-error"></p></div></div><script src="/js/app.js"></script></body></html>
